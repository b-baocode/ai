    const form = document.getElementById("quizForm");

    quizData.forEach((item, index) => {
      // Đóng gói các lựa chọn cùng với thông tin về đáp án đúng
      let mappedOptions = item.options.map((opt, i) => ({ text: opt, isCorrect: i === item.answer }));

      // Thuật toán xáo trộn ngẫu nhiên (Fisher-Yates Shuffle)
      for (let i = mappedOptions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [mappedOptions[i], mappedOptions[j]] = [mappedOptions[j], mappedOptions[i]];
      }

      // Áp dụng vị trí đã xáo trộn trở lại dữ liệu câu hỏi
      item.options = mappedOptions.map(m => m.text);
      item.answer = mappedOptions.findIndex(m => m.isCorrect);

      const div = document.createElement("div");
      div.className = "question";

      let html = "<b>" + item.q + "</b><div class='options'>";

      item.options.forEach((opt, i) => {
        html += `<label><input type="radio" name="q${index}" value="${i}"> <span class="opt-text">${opt}</span></label>`;
      });

      html += "</div>";
      html += `<div class="feedback" style="margin-top: 15px; font-size: 15px; display: none; padding: 10px; border-radius: 5px; background-color: #f8f9fa;"></div>`;
      div.innerHTML = html;
      form.appendChild(div);
    });

    form.addEventListener('change', function (e) {
      if (e.target.type === 'radio') {
        const questionIndex = parseInt(e.target.name.substring(1));
        const selectedAnswer = parseInt(e.target.value);
        const item = quizData[questionIndex];

        const questionDiv = e.target.closest('.question');
        const inputs = questionDiv.querySelectorAll('input');
        const labels = questionDiv.querySelectorAll('label');
        const feedbackDiv = questionDiv.querySelector('.feedback');

        // Check if correct
        const isCorrect = selectedAnswer === item.answer;

        // Highlight items
        labels.forEach((label, i) => {
          const input = label.querySelector('input');
          const textSpan = label.querySelector('.opt-text');

          // Disable radio buttons so user can't pick again
          input.disabled = true;

          if (i === item.answer) {
            textSpan.style.color = 'green';
            textSpan.style.fontWeight = 'bold';
          } else if (i === selectedAnswer && !isCorrect) {
            textSpan.style.color = 'red';
            textSpan.style.textDecoration = 'line-through';
          } else {
            textSpan.style.color = '#888';
          }
        });

        // Provide feedback
        const explanationText = explanations[questionIndex] || `Đáp án đúng là: ${item.options[item.answer]}`;
        feedbackDiv.style.display = 'block';

        if (isCorrect) {
          feedbackDiv.style.borderLeft = "4px solid green";
          feedbackDiv.innerHTML = `<div style="color:green; font-weight:bold; margin-bottom: 5px;">✅ Chính xác!</div>${explanationText}`;
        } else {
          feedbackDiv.style.borderLeft = "4px solid red";
          feedbackDiv.innerHTML = `<div style="color:red; font-weight:bold; margin-bottom: 5px;">❌ Sai rồi. Đáp án đúng là: ${item.options[item.answer]}</div>${explanationText}`;
        }
      }
    });

    function submitQuiz() {
      let score = 0;
      let attempts = 0;

      quizData.forEach((item, index) => {
        const selected = document.querySelector(`input[name="q${index}"]:checked`);
        if (selected) {
          attempts++;
          if (parseInt(selected.value) === item.answer) {
            score++;
          }
        }
      });

      let output = `Bạn đã trả lời đúng ${score} / ${quizData.length} câu.`;
      if (attempts < quizData.length) {
        output += ` (Bạn mới làm ${attempts} câu)`;
      }

      const resultDiv = document.getElementById("result");
      resultDiv.innerText = output;
      resultDiv.style.color = score === quizData.length ? "green" : "#333";

      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

  </script>
